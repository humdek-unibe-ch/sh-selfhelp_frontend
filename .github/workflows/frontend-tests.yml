#
# Frontend test gate (Slice 6).
#
# The Vitest test-tier gate for the SelfHelp frontend (complements
# plugin-runtime-check.yml, which owns tsc + build + host-singleton).
# On every PR to main it runs:
#   1. License headers.
#   2. Vitest unit/component tests (jsdom + Testing Library + MSW). MSW is
#      configured with onUnhandledRequest: 'error', so any real outbound
#      request fails the run (canonical Testing Rule 30). It includes the
#      route contract test, which reads the backend's generated route table
#      from a same-branch-or-main checkout (SELFHELP_BACKEND_DIR, F239).
#
# Referenced by branch protection on `main` (Slice 10).

name: frontend-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Vitest (unit + component)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: License headers
        run: npm run headers:check

      # The route contract test (src/config/__tests__/api-route-contract.test.ts,
      # F239) compares api.config.ts with the backend's generated route table.
      # Same-branch-or-main, like e2e-golden.yml: coordinated work uses equally
      # named branches in both repositories.
      - name: Resolve backend ref (same branch as this build, else main)
        id: backend-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          REF="main"
          if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ] && \
             git ls-remote --exit-code --heads \
               "https://x-access-token:${GH_TOKEN}@github.com/humdek-unibe-ch/sh-selfhelp_backend.git" \
               "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            REF="$BRANCH"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved sh-selfhelp_backend ref: ${REF} (build branch: ${BRANCH})"

      - name: Checkout backend route table (for the route contract test)
        uses: actions/checkout@v4
        with:
          repository: humdek-unibe-ch/sh-selfhelp_backend
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: .backend-checkout
          sparse-checkout: |
            docs/reference/access/api-routes.json
          sparse-checkout-cone-mode: false

      - name: Vitest
        env:
          SELFHELP_BACKEND_DIR: ${{ github.workspace }}/.backend-checkout
        run: npm test
